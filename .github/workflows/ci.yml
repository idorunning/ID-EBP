name: Code and database checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate built Worker syntax
        run: node --check dist/worker.mjs
      - name: Audit dependencies
        run: npm audit --audit-level=high
  postgres:
    name: PostgreSQL 16 concurrency and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install official Ubuntu PostgreSQL packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-16 postgresql-client-16
      - name: Exercise independent sessions and synthetic backup restore
        env:
          ID_EBP_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: node scripts/test-postgres.mjs
      - name: Preserve PostgreSQL verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-verification-${{ github.run_id }}
          path: test-results/postgres-*
          retention-days: 14
          if-no-files-found: warn
